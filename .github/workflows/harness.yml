name: Harness checks

on:
  push:
    paths:
      - '.agents/skills/harness-run/**'
      - 'skills/**'
      - 'harness/**'
      - 'plugins/**'
      - 'tools/testperf/**'
      - 'pytest.ini'
      - '.github/workflows/harness.yml'
  pull_request:
    paths:
      - '.agents/skills/harness-run/**'
      - 'skills/**'
      - 'harness/**'
      - 'plugins/**'
      - 'tools/testperf/**'
      - 'pytest.ini'
      - '.github/workflows/harness.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Test runner, receipts, installer and hooks
        run: |
          python3 -B -m unittest discover -s harness -p 'test_*.py'
          python3 -B harness/test_entry_hook.py
      - name: Verify a clean installation
        run: |
          python3 -B harness/install.py --home "$RUNNER_TEMP/harness-home"
          python3 -B "$RUNNER_TEMP/harness-home/.codex/skills/harness-run/scripts/run.py" --project "$GITHUB_WORKSPACE" doctor

  plugin-suites:
    name: 'Plugin suites (informational: ship does not read it)'
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # test_interview reads a historical commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install suite dependencies
        run: |
          pip install -r plugins/maeng-harness/requirements-dev.txt
          PIP="$(python3 tools/testperf/plugin_checks.py --lane gate --print-pip)"
          if [ -n "$PIP" ]; then pip install $PIP; fi
      - name: Run every enrolled plugin suite in isolation
        run: python3 tools/testperf/plugin_checks.py --lane gate --isolated --require-complete --json plugin-checks.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plugin-checks
          path: plugin-checks.json
          if-no-files-found: warn

  periodic:
    name: 'Plugin periodic (informational: separate from gate)'
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install periodic dependencies
        run: pip install -r plugins/maeng-harness/requirements-dev.txt
      - name: Run the periodic lane on disposable copies
        run: python3 tools/testperf/plugin_checks.py --lane periodic --isolated --require-complete --timeout 13800 --json plugin-checks-periodic.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plugin-checks-periodic
          path: |
            plugin-checks-periodic.json
            periodic-results/
          if-no-files-found: warn
